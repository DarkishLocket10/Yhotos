<!doctype html><canvas id="canvas"></canvas><pre id="result"></pre><script>
const images=[];for(const width of [640,1280,2048]){const c=document.querySelector('canvas');c.width=width;c.height=Math.round(width*2/3);const g=c.getContext('2d');let sky=g.createLinearGradient(0,0,width,c.height);sky.addColorStop(0,'#8ab6d6');sky.addColorStop(.6,'#f5cf82');sky.addColorStop(1,'#31644b');g.fillStyle=sky;g.fillRect(0,0,width,c.height);g.fillStyle='#477454';g.beginPath();g.moveTo(0,c.height);g.lineTo(width*.35,c.height*.4);g.lineTo(width*.6,c.height*.8);g.lineTo(width*.8,c.height*.5);g.lineTo(width,c.height);g.fill();g.fillStyle='#fff2c2';g.beginPath();g.arc(width*.75,c.height*.25,width*.055,0,7);g.fill();images.push({width,base64:c.toDataURL('image/jpeg',.75).split(',')[1]});}document.querySelector('#result').textContent=JSON.stringify(images);
</script>

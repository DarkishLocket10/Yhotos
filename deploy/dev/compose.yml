services:
  postgres:
    image: pgvector/pgvector:pg16@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a
    command: ["postgres", "-c", "ssl=off"]
    environment:
      POSTGRES_USER: yhotos
      POSTGRES_DB: yhotos_test
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run deploy/dev/start.sh first}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yhotos -d yhotos_test"]
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - postgres:/var/lib/postgresql/data
volumes:
  postgres:

# Disposable synthetic-only stack. Shared network namespace permits loopback-only
# plaintext SQLx connections; PostgreSQL is never published on the host.
services:
  postgres:
    image: pgvector/pgvector:pg16@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a
    environment:
      POSTGRES_USER: yhotos
      POSTGRES_DB: yhotos_bench
      POSTGRES_HOST_AUTH_METHOD: trust
    command: [postgres, -c, listen_addresses=127.0.0.1]
    ports:
      - '127.0.0.1:${YHOTOS_BENCH_PORT:-18018}:8080'
    healthcheck:
      test: [CMD, pg_isready, -U, yhotos, -d, yhotos_bench]
      interval: 2s
      timeout: 5s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data
  fixture-loader:
    build:
      context: ../..
      dockerfile: deploy/dev/Dockerfile.bench
    network_mode: service:postgres
    depends_on:
      postgres:
        condition: service_healthy
    # Named volumes initially belong to root; initialize ownership as a separate,
    # short-lived container, before running the loader as the unprivileged user.
    user: '0:0'
    entrypoint: [bash, -ceu]
    command:
      - 'chown 1000:1000 /data /fixture; exec setpriv --reuid=1000 --regid=1000 --clear-groups fixture-loader'
    environment:
      DATABASE_URL: postgres://yhotos@127.0.0.1/yhotos_bench?sslmode=disable
      YHOTOS_FIXTURE_COUNT: ${YHOTOS_FIXTURE_COUNT:-60}
      YHOTOS_FIXTURE_DATA: /data
      YHOTOS_FIXTURE_ROUTES: /fixture/routes.json
    volumes:
      - data:/data
      - fixture:/fixture
    security_opt: [no-new-privileges:true]
  server:
    build:
      context: ../..
      dockerfile: deploy/dev/Dockerfile.bench
    network_mode: service:postgres
    depends_on:
      fixture-loader:
        condition: service_completed_successfully
    environment:
      YHOTOS_PUBLIC_LISTEN: 0.0.0.0:8080
      YHOTOS_DATABASE_URL_PUBLIC: postgres://yhotos@127.0.0.1/yhotos_bench?sslmode=disable
      YHOTOS_DATABASE_TLS: disable
      YHOTOS_PUBLIC_BASE_URL: https://gallery.example
      YHOTOS_DATA_DIR: /data
      # Avoid turning load measurements into cheap-route rate-limit measurements.
      # Auth keeps its default 10/min bucket for the security smoke test.
      YHOTOS_RATE_LIMITS__CHEAP_PER_MIN: '4294967295'
      YHOTOS_RATE_LIMITS__EXPENSIVE_PER_MIN: '4294967295'
    volumes:
      - data:/data:ro
      - fixture:/fixture:ro
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, bash, -c, 'exec 3<>/dev/tcp/127.0.0.1/8080; printf "GET /healthz HTTP/1.0\r\n\r\n" >&3; cat <&3 | grep -q "^ok$$"']
      interval: 2s
      timeout: 5s
      retries: 30
volumes:
  data:
  fixture:

[workspace]
members = ["crates/*"]
exclude = ["fuzz"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "AGPL-3.0-only"
rust-version = "1.99.1"

[workspace.lints.rust]
missing_docs = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "warn"
dbg_macro = "deny"
print_stdout = "deny"
todo = "deny"
unimplemented = "deny"

[workspace.dependencies]
tokio = { version = "=1.54.1", features = ["macros", "rt-multi-thread"] }
axum = "=0.8.9"
tower = "=0.5.3"
tower-http = "=0.7.1"
sqlx = { version = "=0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "uuid", "time", "json", "macros", "migrate"] }
uuid = { version = "=1.28.0", features = ["v7", "serde"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
thiserror = "=2.0.21"
anyhow = "=1.0.104"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "json"] }
secrecy = "=0.10.3"
blake3 = "=1.8.7"
subtle = "=2.6.1"
criterion = { version = "=0.8.2", default-features = false, features = ["cargo_bench_support"] }
proptest = "=1.12.0"
tempfile = "=3.27.0"
argon2 = { version = "=0.6.0", features = ["zeroize"] }
password-hash = { version = "=0.6.1", features = ["phc"] }
rand = "=0.8.8"
zeroize = { version = "=1.9.1", features = ["derive"] }
base64 = "=0.23.1"
hmac = "=0.13.0"
sha1 = "=0.11.0"
webauthn-rs = { version = "=0.5.5", default-features = false, features = ["danger-allow-state-serialisation"] }
webauthn-authenticator-rs = { version = "=0.5.5", features = ["softtoken"] }
chacha20poly1305 = { version = "=0.11.0", features = ["zeroize"] }

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
opt-level = 3

[profile.bench]
inherits = "release"
debug = 1

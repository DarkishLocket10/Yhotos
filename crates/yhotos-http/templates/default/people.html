<!doctype html><html lang="en"><head><meta charset="utf-8"><title>People · Yhotos</title><link rel="stylesheet" href="{{ stylesheet }}"><meta name="viewport" content="width=device-width, initial-scale=1"></head><body><main><h1>People</h1>
<form method="get" action="/admin/people/search"><label>Person search<input name="q" value="person:" maxlength="90"></label><button>Find person</button></form>
<form method="post" action="/admin/people/rebuild"><input type="hidden" name="_csrf" value="{{ csrf }}"><button>Rebuild people</button></form>
{% for person in people %}<section><h2>{% if let Some(name) = person.name %}{{ name }}{% else %}Unnamed person {{ loop.index }}{% endif %}</h2><p>{{ person.count }} faces</p><a href="/admin/people/{{ person.id }}">Search photos of this person</a>
<form method="post" action="/admin/people/{{ person.id }}"><input type="hidden" name="_csrf" value="{{ csrf }}"><label>Name<input name="name" maxlength="80" value="{% if let Some(name) = person.name %}{{ name }}{% endif %}"></label><label><input type="checkbox" name="hide" value="true">Hide this person</label><button>Save person</button></form>
<form method="post" action="/admin/people/{{ person.id }}/merge"><input type="hidden" name="_csrf" value="{{ csrf }}"><label>Merge into person<select name="target">{% for target in people %}{% if target.id != person.id %}<option value="{{ target.id }}">{% if let Some(name) = target.name %}{{ name }}{% else %}Unnamed person {{ loop.index }}{% endif %}</option>{% endif %}{% endfor %}</select></label><button>Merge people</button></form></section>{% endfor %}
</main></body></html>

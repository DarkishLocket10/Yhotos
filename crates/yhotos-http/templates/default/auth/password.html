<!doctype html><html lang="en"><meta charset="utf-8"><title>Change password</title><h1>Change password</h1>
{% if forced %}<p>You must change your temporary password before continuing.</p>{% endif %}
<form method="post" action="{{ action }}"><input type="hidden" name="_csrf" value="{{ csrf }}">{% if !forced %}<label>Current password <input type="password" name="current_password" autocomplete="current-password" required></label>{% endif %}<p>Use at least 12 characters, at most 256 bytes, and avoid common passwords or your username.</p><label>New password <input type="password" name="new_password" autocomplete="new-password" minlength="12" maxlength="256" required></label><button>Change password</button></form></html>

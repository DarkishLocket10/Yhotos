{% if actions.like %}<form action="/s/photos/{{ actions.photo }}/like" method="post"><input type="hidden" name="_csrf" value="{{ actions.csrf }}"><button type="submit" data-like data-photo-id="{{ actions.short_id }}" aria-pressed="false">Like photo</button></form>{% endif %}{% if actions.flag %}<form action="/s/photos/{{ actions.photo }}/flag" method="post"><input type="hidden" name="_csrf" value="{{ actions.csrf }}"><button type="submit" data-flag data-photo-id="{{ actions.short_id }}" aria-pressed="false">Flag photo for review</button></form>{% endif %}
<p role="status" aria-live="polite" data-action-status></p>

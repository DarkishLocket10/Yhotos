<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{{ title }}</title><link rel="stylesheet" href="{{ stylesheet }}"></head>
<body><main><h1>{{ title }}</h1><div class="share-grid">
{% for photo in photos %}<figure>
{% if let Some(image) = photo.image %}<img src="{{ image }}" width="{{ photo.width }}" height="{{ photo.height }}" loading="lazy" decoding="async" alt="{{ photo.title }}">{% endif %}
<figcaption>{{ photo.title }}</figcaption>
{% if download %}<a href="/o/{{ photo.original_hash }}/download?download=1">Download original</a>{% endif %}
{% if like %}<form action="/s/photos/{{ photo.id }}/like" method="post"><input type="hidden" name="_csrf" value="{{ csrf }}"><button type="submit">Like photo</button></form>{% endif %}
{% if flag %}<form action="/s/photos/{{ photo.id }}/flag" method="post"><input type="hidden" name="_csrf" value="{{ csrf }}"><button type="submit">Flag photo for review</button></form>{% endif %}
</figure>{% endfor %}</div></main></body></html>

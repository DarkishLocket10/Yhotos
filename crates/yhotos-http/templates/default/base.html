<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ title }} · Yhotos</title>
<meta name="description" content="{{ description }}">
<link rel="stylesheet" href="{{ context.stylesheet }}">
{% if !styles.is_empty() %}<style nonce="{{ context.nonce }}">{{ styles|safe }}</style>{% endif %}
<script type="module" nonce="{{ context.nonce }}" src="{{ context.script }}"></script>
{% block metadata %}{% endblock %}
</head>
<body><header class="site-header"><a href="/">Yhotos</a><span>Photo gallery</span></header>{% block content %}{% endblock %}<footer>Yhotos photo gallery</footer></body>
</html>

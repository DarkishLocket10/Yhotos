[package]
name = "yhotos-http"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
default = []
admin = ["yhotos-config/admin"]

[dependencies]
yhotos-config = { path = "../yhotos-config" }
yhotos-core = { path = "../yhotos-core" }
yhotos-db = { path = "../yhotos-db" }
yhotos-storage = { path = "../yhotos-storage" }
sqlx.workspace = true
moka.workspace = true
tokio-util.workspace = true
http-body-util.workspace = true
axum.workspace = true
tokio = { workspace = true, features = ["time", "net"] }
tower-http = { workspace = true, features = ["trace", "limit", "timeout"] }
tracing.workspace = true
anyhow.workspace = true
thiserror.workspace = true
uuid.workspace = true
askama.workspace = true
rust-embed.workspace = true
dashmap.workspace = true
base64.workspace = true
getrandom.workspace = true
blake3.workspace = true
subtle.workspace = true
serde.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tower = { workspace = true, features = ["util"] }
http-body-util.workspace = true
tempfile.workspace = true
figment.workspace = true
tracing-subscriber.workspace = true
log.workspace = true

[package]
name = "yhotos-http"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
default = ["ml-client"]
ml-client = []
admin = ["yhotos-config/admin", "yhotos-db/admin", "dep:yhotos-pipeline"]
# Enables only an explicit test constructor; Auth::new retains production costs.
test-util = ["yhotos-auth/test-util"]

[dependencies]
pulldown-cmark.workspace = true
ammonia.workspace = true
yhotos-pipeline = { path = "../yhotos-pipeline", optional = true }
yhotos-config = { path = "../yhotos-config" }
yhotos-core = { path = "../yhotos-core" }
yhotos-db = { path = "../yhotos-db" }
yhotos-storage = { path = "../yhotos-storage" }
sqlx.workspace = true
moka.workspace = true
tokio-util.workspace = true
futures-core.workspace = true
http-body-util.workspace = true
axum.workspace = true
tokio = { workspace = true, features = ["time", "net"] }
tower-http = { workspace = true, features = ["trace", "limit", "timeout"] }
tracing.workspace = true
metrics.workspace = true
anyhow.workspace = true
thiserror.workspace = true
uuid.workspace = true
askama.workspace = true
rust-embed.workspace = true
dashmap.workspace = true
base64.workspace = true
getrandom.workspace = true
blake3.workspace = true
subtle.workspace = true
serde.workspace = true
serde_json.workspace = true

yhotos-auth = { path = "../yhotos-auth" }
yhotos-jobs = { path = "../yhotos-jobs" }
secrecy.workspace = true
time.workspace = true
zeroize.workspace = true
qrcode.workspace = true

[dev-dependencies]
insta.workspace = true
flate2.workspace = true
# Enable the constructor for integration tests, including default-feature test runs.
yhotos-http = { path = ".", features = ["test-util"] }
webauthn-authenticator-rs.workspace = true
sqlx.workspace = true

tokio = { workspace = true, features = ["test-util"] }
tower = { workspace = true, features = ["util"] }
http-body-util.workspace = true
tempfile.workspace = true
figment.workspace = true
url.workspace = true
tracing-subscriber.workspace = true
log.workspace = true

[[example]]
name = "pages_fixture"
path = "../../deploy/dev/pages_fixture.rs"

[package]
name = "yhotos-bench"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
raw = ["yhotos-codec/raw"]

[dev-dependencies]
criterion.workspace = true
base64.workspace = true
sqlx.workspace = true
http-body-util.workspace = true
yhotos-auth = { path = "../yhotos-auth" }
yhotos-db = { path = "../yhotos-db" }
secrecy.workspace = true
serde_json.workspace = true
time.workspace = true
yhotos-core = { path = "../yhotos-core" }
yhotos-config = { path = "../yhotos-config" }
yhotos-http = { path = "../yhotos-http", features = ["admin"] }
yhotos-storage = { path = "../yhotos-storage" }
yhotos-codec = { path = "../yhotos-codec" }
axum.workspace = true
tokio.workspace = true
tower = { workspace = true, features = ["util"] }
tempfile.workspace = true
uuid.workspace = true

[[bench]]
name = "auth"
harness = false

[[bench]]
name = "access"
harness = false

[[bench]]
name = "http"
harness = false

[[bench]]
name = "jobs"
harness = false

[[bench]]
name = "session"
harness = false

[[bench]]
name = "storage"
harness = false

[[bench]]
name = "files"
harness = false

[[bench]]
name = "pages"
harness = false

[[bench]]
name = "codec"
harness = false

[[bench]]
name = "share"
harness = false

[dev-dependencies.yhotos-pipeline]
path = "../yhotos-pipeline"

[[bench]]
name = "pipeline"
harness = false

[[bench]]
name = "interactions"
harness = false

[[bench]]
name = "upload"
harness = false

[[bench]]
name = "geo_views"
harness = false

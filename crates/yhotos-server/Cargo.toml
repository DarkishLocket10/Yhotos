[package]
name = "yhotos-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
default = []
admin = ["yhotos-http/admin", "yhotos-config/admin"]

[dependencies]
yhotos-config = { path = "../yhotos-config" }
yhotos-http = { path = "../yhotos-http" }
tokio = { workspace = true, features = ["net", "signal", "time", "sync"] }
axum.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
mimalloc.workspace = true

yhotos-auth = { path = "../yhotos-auth" }
yhotos-db = { path = "../yhotos-db" }
secrecy.workspace = true

[dev-dependencies]
sqlx.workspace = true
tempfile.workspace = true
uuid.workspace = true
base64.workspace = true

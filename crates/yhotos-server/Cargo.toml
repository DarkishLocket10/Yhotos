[package]
name = "yhotos-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
default = ["ml-client"]
ml-client = ["yhotos-http/ml-client"]
admin = ["yhotos-http/admin", "yhotos-config/admin"]

[dependencies]
yhotos-config = { path = "../yhotos-config" }
yhotos-http = { path = "../yhotos-http", default-features = false }
yhotos-db = { path = "../yhotos-db" }
yhotos-storage = { path = "../yhotos-storage" }
tokio = { workspace = true, features = ["net", "signal", "time", "sync"] }
tokio-io-timeout.workspace = true
axum.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
mimalloc.workspace = true

yhotos-auth = { path = "../yhotos-auth" }
secrecy.workspace = true

[dev-dependencies]
sqlx.workspace = true
tempfile.workspace = true
uuid.workspace = true
base64.workspace = true
figment.workspace = true
yhotos-core = { path = "../yhotos-core" }
tower = { workspace = true, features = ["util"] }

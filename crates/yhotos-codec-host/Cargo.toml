[package]
name = "yhotos-codec-host"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
yhotos-codec = { path = "../yhotos-codec", features = ["heif"] }
serde.workspace = true
serde_json.workspace = true
nix.workspace = true
blake3.workspace = true
base64.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
seccompiler.workspace = true

[dev-dependencies]
tempfile.workspace = true

[features]
test-hooks = []
raw = ["yhotos-codec/raw"]

[dev-dependencies.yhotos-pipeline]
path = "../yhotos-pipeline"
features = ["test-hooks"]

[dev-dependencies.yhotos-core]
path = "../yhotos-core"

[dev-dependencies.yhotos-db]
path = "../yhotos-db"

[dev-dependencies.yhotos-storage]
path = "../yhotos-storage"

[dev-dependencies.sqlx]
workspace = true

[dev-dependencies.tokio]
workspace = true

[dev-dependencies.uuid]
workspace = true

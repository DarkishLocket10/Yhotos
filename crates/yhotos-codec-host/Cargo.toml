[package]
name = "yhotos-codec-host"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
yhotos-codec = { path = "../yhotos-codec", features = ["heif"] }
serde.workspace = true
serde_json.workspace = true
nix.workspace = true
blake3.workspace = true
base64.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
seccompiler.workspace = true
landlock.workspace = true

[dev-dependencies]
axum.workspace = true
futures-core.workspace = true
base64.workspace = true
figment.workspace = true
secrecy.workspace = true
http-body-util.workspace = true
tower = { workspace = true, features = ["util"] }
yhotos-auth = { path = "../yhotos-auth", features = ["test-util"] }
yhotos-config = { path = "../yhotos-config", features = ["admin"] }
tempfile.workspace = true
async-trait.workspace = true
tokio-util = { workspace = true, features = ["rt"] }
yhotos-jobs = { path = "../yhotos-jobs" }
yhotos-http = { path = "../yhotos-http", features = ["admin", "test-util"] }
jiff.workspace = true
time = { workspace = true, features = ["macros"] }

[features]
test-hooks = []
raw = ["yhotos-codec/raw"]

[dev-dependencies.yhotos-pipeline]
path = "../yhotos-pipeline"
features = ["test-hooks"]

[dev-dependencies.yhotos-core]
path = "../yhotos-core"

[dev-dependencies.yhotos-db]
path = "../yhotos-db"

[dev-dependencies.yhotos-storage]
path = "../yhotos-storage"

[dev-dependencies.sqlx]
workspace = true

[dev-dependencies.tokio]
workspace = true

[dev-dependencies.uuid]
workspace = true

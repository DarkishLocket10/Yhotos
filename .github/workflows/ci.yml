name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  SQLX_OFFLINE: 'true'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install native codec development libraries
        run: sudo apt-get update && sudo apt-get install -y unzip libvips-dev libvips-tools liblcms2-dev libclang-dev libjxl-dev libheif-plugin-aomenc libheif-plugin-aomdec libheif-plugin-libde265
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Check Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build TypeScript islands
        working-directory: web
        run: |
          npm ci
          npm run check
      - name: Test offline gazetteer importer
        run: python3 -m unittest discover -s deploy/geo -p 'test_*.py'
      - name: Test browser video source selection
        run: |
          deploy/dev/video-tools.sh
          cd web
          npx playwright install --with-deps chromium
          npm run e2e -- video.spec.ts
      - name: Test bundled islands
        run: node --test crates/yhotos-http/tests/passkey_redirect.mjs crates/yhotos-http/tests/upload.mjs

  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:pg16@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a
        env:
          POSTGRES_USER: yhotos
          POSTGRES_DB: yhotos_test
          # Disposable, localhost-only CI database; no stored credentials.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready --username yhotos --dbname yhotos_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://yhotos@127.0.0.1:5432/yhotos_test?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install native codec development libraries
        run: sudo apt-get update && sudo apt-get install -y unzip libvips-dev libvips-tools liblcms2-dev libclang-dev libjxl-dev libheif-plugin-aomenc libheif-plugin-aomdec libheif-plugin-libde265
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install pinned SQLx CLI
        run: cargo install sqlx-cli --version 0.9.0 --locked --no-default-features --features postgres,rustls
      - name: Apply database migrations
        run: cargo sqlx migrate run --source crates/yhotos-db/migrations
      - name: Test gazetteer import against PostgreSQL
        run: python3 -m unittest discover -s deploy/geo -p 'test_*.py'
      - name: Extract pinned static video parsers
        run: deploy/dev/video-tools.sh
      - name: Test workspace
        run: cargo test --workspace --all-features
      - name: Test public build without admin routes
        run: cargo test -p yhotos-config -p yhotos-http -p yhotos-server --no-default-features

  deny:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          rust-version: '1.99.1'
          # Match scripts/check.sh rather than the action's --all-features default.
          arguments: ''

  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install cargo-audit
        run: cargo install --locked cargo-audit --version 0.22.2
      - name: Audit dependencies
        run: cargo audit

  gitleaks:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_VERSION: '8.30.1'
          GITLEAKS_ENABLE_COMMENTS: 'false'
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'

  codec:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:pg16@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a
        env:
          POSTGRES_USER: yhotos
          POSTGRES_DB: yhotos_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready --username yhotos --dbname yhotos_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build codec image from pinned base digest
        run: docker build --iidfile /tmp/codec-image -f deploy/dev/Dockerfile.codec .
      - name: Test Linux codec and seccomp inside the built image digest
        run: docker run --rm --network=host -e SQLX_OFFLINE=true -e DATABASE_URL=postgres://yhotos@127.0.0.1:5432/yhotos_test?sslmode=disable -v "$PWD:/workspace" "$(cat /tmp/codec-image)"

name: Fuzz parsers
on:
  pull_request:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fuzz-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: scripts/ci-changes.sh

  fuzz:
    needs: changes
    # Untrusted PR code NEVER runs on tower, including PRs carrying labels.
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-24.04' || fromJSON('["self-hosted","tower"]') }}
    if: needs.changes.outputs.code == 'true' && (github.event_name == 'pull_request' || github.ref == 'refs/heads/main')
    timeout-minutes: 360
    env:
      FUZZ_TOOLCHAIN: nightly-2026-10-20
      FUZZ_SECONDS: ${{ github.event_name == 'pull_request' && '60' || '1800' }}
      VIPS_CONCURRENCY: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install native libraries (hosted PR runner only)
        if: github.event_name == 'pull_request'
        timeout-minutes: 16
        run: scripts/ci-apt.sh
      - name: Install pinned fuzz tools
        run: |
          rustup toolchain install "$FUZZ_TOOLCHAIN" --profile minimal
          cargo install cargo-fuzz --version 0.13.2 --locked
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: fuzz/corpus
          key: fuzz-corpus-${{ runner.os }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ runner.os }}-
      - name: Fuzz changed parsers on PRs, all parsers nightly
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          if [[ "$EVENT" == pull_request ]]; then
            scripts/fuzz-smoke.sh --changed "$(git merge-base HEAD "$BASE_SHA")"
          else
            if [[ $(date -u +%u) == 7 ]]; then export FUZZ_MINIMIZE=true; fi
            scripts/fuzz-smoke.sh
          fi
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: success() && github.event_name != 'pull_request'
        with:
          path: fuzz/corpus
          key: fuzz-corpus-${{ runner.os }}-${{ github.run_id }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: fuzz-crashes-${{ github.run_id }}
          path: fuzz/artifacts
          if-no-files-found: warn
          retention-days: 30

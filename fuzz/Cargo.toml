[package]
name = "yhotos-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
license = "AGPL-3.0-only"
rust-version = "1.99.1"

[workspace]
members = ["."]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "=0.4.13"
arbitrary = { version = "=1.5.0", features = ["derive"] }
base64 = "=0.23.1"
tempfile = "=3.27.0"
yhotos-auth = { path = "../crates/yhotos-auth" }
yhotos-codec = { path = "../crates/yhotos-codec", features = ["raw"] }

[[bin]]
name = "token_parse"
path = "fuzz_targets/token_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "safe_join"
path = "fuzz_targets/safe_join.rs"
test = false
doc = false
bench = false

[[bin]]
name = "range_header"
path = "fuzz_targets/range_header.rs"
test = false
doc = false
bench = false

[[bin]]
name = "identify"
path = "fuzz_targets/identify.rs"
test = false
doc = false
bench = false

[[bin]]
name = "search_query"
path = "fuzz_targets/search_query.rs"
test = false
doc = false
bench = false

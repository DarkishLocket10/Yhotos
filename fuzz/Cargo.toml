[package]
name = "yhotos-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
license = "AGPL-3.0-only"
rust-version = "1.99.1"

[workspace]
members = ["."]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "=0.4.13"
arbitrary = { version = "=1.5.0", features = ["derive"] }
base64 = "=0.23.1"
yhotos-auth = { path = "../crates/yhotos-auth" }

[[bin]]
name = "token_parse"
path = "fuzz_targets/token_parse.rs"
test = false
doc = false
bench = false
